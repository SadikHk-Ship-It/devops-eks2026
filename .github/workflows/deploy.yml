name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.ECR_REPOSITORY }}:latest \
            -t ${{ secrets.ECR_REPOSITORY }}:${{ github.sha }} .

      - name: Tag image for ECR
        run: |
          docker tag ${{ secrets.ECR_REPOSITORY }}:latest \
          244530008913.dkr.ecr.eu-west-1.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest

          docker tag ${{ secrets.ECR_REPOSITORY }}:${{ github.sha }} \
          244530008913.dkr.ecr.eu-west-1.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Push latest
        run: |
          docker push \
          244530008913.dkr.ecr.eu-west-1.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest

      - name: Push SHA tag
        run: |
          docker push \
          244530008913.dkr.ecr.eu-west-1.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}